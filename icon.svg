<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background 3D Radial Depth: Deep Obsidian to Emerald Teal Glow -->
    <radialGradient id="bgGrad" cx="35%" cy="28%" r="88%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="35%" stop-color="#064e3b"/>
      <stop offset="70%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#01140e"/>
    </radialGradient>

    <!-- Outer Squircle 3D Metallic Chamfer Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#059669" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#065f46" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.85"/>
    </linearGradient>

    <!-- 3D Heavy Tungsten Carbide Steel Shank Gradient -->
    <linearGradient id="steelChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="22%" stop-color="#94a3b8"/>
      <stop offset="48%" stop-color="#ffffff"/>
      <stop offset="72%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- 24K Polished Industrial Gold Bit Gradient -->
    <linearGradient id="goldLight" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="20%" stop-color="#fde047"/>
      <stop offset="45%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <linearGradient id="goldShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="60%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>

    <!-- 3D Dynamic Hydro-Flow Cyan Ribbon Gradient -->
    <linearGradient id="flowRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="20%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="85%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>

    <linearGradient id="flowGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Pill Badge Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- 3D Elevation Filters -->
    <filter id="shadow3D" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="innerDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glowAqua" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#facc15" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- ==================== 1. 3D SQUIRCLE EMBLEM BASE ==================== -->
  <rect x="18" y="18" width="476" height="476" rx="116" fill="url(#bgGrad)" filter="url(#shadow3D)"/>
  <rect x="20" y="20" width="472" height="472" rx="114" fill="none" stroke="url(#rimGrad)" stroke-width="4.5"/>

  <!-- Geometric Depth Grid & Subsurface Drilling Coordinate Rings -->
  <circle cx="256" cy="216" r="182" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="16 12" opacity="0.2"/>
  <circle cx="256" cy="216" r="148" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="24 16" opacity="0.3"/>
  <circle cx="256" cy="216" r="112" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.25"/>

  <!-- ==================== 2. 3D HYDRO FLOW WAVE RIBBONS (SPIRALING UPWARD) ==================== -->
  <!-- Back Fluid Stream -->
  <g filter="url(#glowAqua)">
    <path d="M 134 268 C 120 200 152 136 212 108 C 262 84 322 88 362 118 C 404 150 418 206 398 258 C 382 300 338 334 294 340 C 274 343 260 354 256 364 C 252 354 238 343 218 340 C 172 332 142 308 134 268 Z" fill="url(#flowRibbon)" opacity="0.95"/>
    
    <!-- Ultra Gloss Specular Curve (Reflecting Sunlight on Water Flow) -->
    <path d="M 218 114 C 182 136 156 178 148 228 C 142 264 152 292 162 302 C 154 282 150 250 160 216 C 172 174 200 138 228 118 Z" fill="url(#flowGleam)"/>
    
    <!-- Secondary Dynamic Orbiting Water Loop (Flow Wave Ribbon) -->
    <path d="M 374 152 C 392 188 396 228 382 262 C 366 300 326 328 286 338 C 298 322 312 298 320 268 C 330 228 328 188 316 156 C 336 150 358 148 374 152 Z" fill="#38bdf8" opacity="0.45"/>
  </g>

  <!-- ==================== 3. 3D HEAVY DRILL RIG ROTARY SHAFT ==================== -->
  <g filter="url(#innerDepth)">
    <!-- Top Hydraulic Drive Collar -->
    <rect x="224" y="58" width="64" height="42" rx="10" fill="url(#steelChrome)"/>
    <!-- Heavy Flange Joint Ring -->
    <rect x="214" y="96" width="84" height="18" rx="6" fill="url(#goldLight)"/>
    <rect x="218" y="99" width="76" height="4" rx="2" fill="#ffffff" opacity="0.8"/>
    <!-- Chrome Drill Stem Rod -->
    <rect x="234" y="114" width="44" height="74" rx="6" fill="url(#steelChrome)"/>
    <!-- Threaded Stabilization Chuck -->
    <polygon points="228,188 284,188 292,204 220,204" fill="url(#goldShade)"/>
    <polygon points="230,190 282,190 288,202 224,202" fill="url(#goldLight)"/>
  </g>

  <!-- ==================== 4. 3D TRIPLE-CONE TRICONE DRILL BIT ==================== -->
  <g filter="url(#glowGold)">
    <!-- Main Heavy Carbide Bit Cone Geometry -->
    <path d="M 206 204 L 306 204 L 276 298 L 256 348 L 236 298 Z" fill="url(#goldShade)"/>

    <!-- Left Spiral Cutting Flute (Polished Industrial Gold) -->
    <path d="M 206 204 C 230 220 248 248 240 284 L 216 244 Z" fill="url(#goldLight)"/>
    <path d="M 208 206 C 224 218 236 240 234 266 L 222 242 Z" fill="url(#goldHighlight)" opacity="0.75"/>

    <!-- Center Rotary Power Spine (3D High Relief) -->
    <path d="M 242 204 L 270 204 L 264 286 L 256 348 L 248 286 Z" fill="url(#goldHighlight)"/>
    <line x1="256" y1="204" x2="256" y2="346" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Flute Shadow Face -->
    <path d="M 276 204 C 302 226 306 258 292 290 L 270 252 Z" fill="url(#goldLight)"/>

    <!-- Diamond Rock-Cutting Inserts (Precision Teeth Rows) -->
    <circle cx="228" cy="226" r="4" fill="#ffffff"/>
    <circle cx="236" cy="254" r="4" fill="#ffffff"/>
    <circle cx="276" cy="226" r="4" fill="#ffffff"/>
    <circle cx="268" cy="254" r="4" fill="#ffffff"/>

    <!-- Tungsten Bullet Pilot Tip (Ultra Hardened Rock Penetrator) -->
    <polygon points="256,316 270,354 256,376 242,354" fill="#ffffff" filter="url(#glowGold)"/>
    <polygon points="256,316 270,354 256,376" fill="url(#goldHighlight)"/>
  </g>

  <!-- ==================== 5. SUBTERRANEAN AQUIFER PRESSURE SPARKS ==================== -->
  <circle cx="256" cy="382" r="6" fill="#fef08a" filter="url(#glowGold)"/>
  <circle cx="232" cy="392" r="4" fill="#38bdf8" filter="url(#glowAqua)"/>
  <circle cx="280" cy="392" r="4" fill="#38bdf8" filter="url(#glowAqua)"/>
  <circle cx="216" cy="374" r="2.5" fill="#a5f3fc"/>
  <circle cx="296" cy="374" r="2.5" fill="#a5f3fc"/>

  <!-- ==================== 6. MASTER BRAND TYPOGRAPHY: DRILLRIG FLOW ==================== -->
  <!-- 3D Shadow Base Layer for DRILLRIG -->
  <text x="256" y="438" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="36" font-weight="900" fill="#01140e" text-anchor="middle" letter-spacing="4" opacity="0.75">DRILLRIG</text>
  <!-- Foreground Crisp Text with Gradient Sheen -->
  <text x="256" y="434" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">DRILLRIG</text>

  <!-- Modern SaaS FLOW Aqua Pill Badge -->
  <g transform="translate(182, 450)">
    <rect width="148" height="28" rx="14" fill="url(#pillGrad)" filter="url(#glowAqua)"/>
    <text x="74" y="19" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="14.5" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="5">FLOW</text>
  </g>
</svg>
