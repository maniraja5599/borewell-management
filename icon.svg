<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background 3D Radial Dark Gradient -->
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="45%" stop-color="#064e3b"/>
      <stop offset="85%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#011813"/>
    </radialGradient>

    <!-- Outer Squircle Rim Gradient (3D Bevel) -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#059669" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#047857" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7"/>
    </linearGradient>

    <!-- 3D Gold Metallic Bit Gradient -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#facc15"/>
      <stop offset="55%" stop-color="#eab308"/>
      <stop offset="85%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="40%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- 3D Cyan Aqua Water Drop / Wave Gradient -->
    <linearGradient id="aquaGrad" x1="20%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="25%" stop-color="#38bdf8"/>
      <stop offset="65%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Steel Chrome Metal Gradient for Heavy Drill Shaft -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- 3D Drop Shadows & Glow Filters -->
    <filter id="shadow3D" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#facc15" flood-opacity="0.45"/>
    </filter>

    <filter id="glowAqua" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- 3D Squircle Base Container with Inner Lighting -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" filter="url(#shadow3D)"/>
  <rect x="18" y="18" width="476" height="476" rx="110" fill="none" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- Background Orbit / Flow Energy Rings (3D Depth) -->
  <circle cx="256" cy="226" r="176" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.25"/>
  <circle cx="256" cy="226" r="144" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="24 16" opacity="0.35"/>

  <!-- 3D Water Crystal Wave Arc (Flowing up from earth) -->
  <g filter="url(#glowAqua)">
    <path d="M 148 290 C 132 230 162 165 215 132 C 248 112 290 110 324 126 C 362 144 386 182 386 224 C 386 278 344 322 294 332 C 278 335 264 346 256 358 C 248 346 234 335 218 332 C 182 325 154 310 148 290 Z" fill="url(#aquaGrad)" opacity="0.95"/>
    <!-- Glass Highlight Reflection on Water Drop -->
    <path d="M 230 138 C 210 152 186 182 178 220 C 172 250 180 274 186 284 C 182 268 180 242 188 214 C 196 182 216 156 230 138 Z" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- 3D Heavy Drill Rig Shaft & Steel Guides -->
  <g filter="url(#shadow3D)">
    <!-- Top Drive Steel Cylinder -->
    <rect x="228" y="68" width="56" height="52" rx="10" fill="url(#steelGrad)"/>
    <rect x="220" y="112" width="72" height="18" rx="6" fill="url(#goldLight)"/>
    <!-- Heavy Drill Rod -->
    <rect x="238" y="130" width="36" height="74" rx="4" fill="url(#steelGrad)"/>
  </g>

  <!-- 3D Diamond Carbide Drill Bit (Triple Flute Cone) -->
  <g filter="url(#glowGold)">
    <!-- Drill Core Body Triangle -->
    <path d="M 210 204 L 302 204 L 272 296 L 256 342 L 240 296 Z" fill="url(#goldDark)"/>
    
    <!-- 3D Spiral Flute 1 (Left Blade) -->
    <path d="M 210 204 C 232 218 248 242 240 274 L 218 240 Z" fill="url(#goldLight)"/>
    <!-- 3D Spiral Flute 2 (Center High Gloss Ridge) -->
    <path d="M 244 204 L 268 204 L 262 284 L 256 342 L 250 284 Z" fill="url(#goldLight)"/>
    <!-- 3D Spiral Flute 3 (Right Metallic Shade) -->
    <path d="M 276 204 C 298 224 300 252 288 280 L 268 248 Z" fill="#fef08a"/>

    <!-- Sharp Tungsten Carbide Point Tip (3D Gold Diamond Spark) -->
    <polygon points="256,310 268,348 256,368 244,348" fill="#ffffff"/>
    <polygon points="256,310 268,348 256,368" fill="url(#goldLight)"/>
  </g>

  <!-- 3D Ground Penetration Sparks & High-Pressure Jet -->
  <circle cx="256" cy="374" r="5" fill="#fef08a" filter="url(#glowGold)"/>
  <circle cx="236" cy="384" r="3" fill="#38bdf8"/>
  <circle cx="276" cy="384" r="3" fill="#38bdf8"/>

  <!-- Modern SaaS Brand Typography: DRILLRIG FLOW -->
  <!-- 3D Shadow Plate behind text -->
  <text x="256" y="438" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="38" font-weight="900" fill="#022c22" text-anchor="middle" letter-spacing="3" opacity="0.6">DRILLRIG</text>
  <!-- Main Crisp Text -->
  <text x="256" y="434" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">DRILLRIG</text>

  <!-- Flow Pill Accent Badge -->
  <g transform="translate(186, 452)">
    <rect width="140" height="26" rx="13" fill="url(#aquaGrad)"/>
    <text x="70" y="18" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">FLOW</text>
  </g>
</svg>
