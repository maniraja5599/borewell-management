<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Borewell Prices — DrillRig Marketplace</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <style>
        :root { --pri: #15803d; --pri-d: #0f5132; --bg: #f3f6f4; --card: #fff; --ink: #101814; --mut: #5b6660; --line: #dce3df; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--ink); }
        .top { background: #0d3b22; color: #fff; padding: 16px 20px; }
        .top-in { max-width: 820px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .brand { font-weight: 800; font-size: 18px; color: #fff; text-decoration: none; }
        .back { color: #d1fae5; font-size: 13px; font-weight: 600; text-decoration: none; }
        .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 48px; }
        .hero h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -0.02em; }
        .hero p { margin: 0 0 18px; color: var(--mut); font-size: 14px; line-height: 1.5; }
        .filter-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
        @media (max-width: 600px) { .filter-card { grid-template-columns: 1fr; } }
        .fg { display: flex; flex-direction: column; gap: 4px; }
        .fg label { font-size: 11.5px; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: 0.04em; }
        .fg input { height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; font: 600 14px/1 Inter, sans-serif; color: var(--ink); background: #f8faf9; }
        .list { display: flex; flex-direction: column; gap: 12px; }
        .ag-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
        .ag-card.is-featured { border: 2px solid var(--pri); background: linear-gradient(180deg, #f0fdf4 0%, #fff 45%); }
        .ag-info { min-width: 220px; flex: 1; }
        .ag-badges { display: flex; gap: 6px; margin-bottom: 6px; }
        .badge { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: #eef2f0; color: var(--pri-d); }
        .badge.live { background: #dcfce7; color: #166534; }
        .ag-info h3 { margin: 0 0 4px; font-size: 16.5px; }
        .ag-meta { font-size: 13px; color: var(--mut); }
        .ag-price { text-align: right; }
        .ag-total { font-size: 22px; font-weight: 800; color: var(--pri-d); font-variant-numeric: tabular-nums; }
        .ag-sub { font-size: 12px; color: var(--mut); margin-bottom: 8px; }
        .wa-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 10px; background: var(--pri); color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; }
        .empty { text-align: center; padding: 32px; color: var(--mut); background: var(--card); border-radius: 16px; border: 1px solid var(--line); }
    </style>
</head>
<body>
    <header class="top">
        <div class="top-in">
            <a href="./index.html" class="brand">DrillRig. Marketplace</a>
            <a href="./index.html" class="back">← Open Billing App</a>
        </div>
    </header>
    <main class="wrap">
        <div class="hero">
            <h1>Compare borewell drilling prices</h1>
            <p>Enter your city, drilling depth, and casing pipe feet to compare estimated totals using each agency's progressive slab rates.</p>
        </div>
        <section class="filter-card">
            <div class="fg">
                <label for="mktCity">City / District</label>
                <input type="text" id="mktCity" placeholder="All cities (e.g. Namakkal)">
            </div>
            <div class="fg">
                <label for="mktDepth">Drilling Depth (ft)</label>
                <input type="number" id="mktDepth" value="450" min="50" max="2000">
            </div>
            <div class="fg">
                <label for="mktCasing">7" Casing Pipe (ft)</label>
                <input type="number" id="mktCasing" value="60" min="0" max="500">
            </div>
        </section>
        <section class="list" id="mktList"></section>
    </main>
    <script type="module" src="./src/marketplace/marketplace.js"></script>
</body>
</html>
