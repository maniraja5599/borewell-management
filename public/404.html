<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found — DrillRig</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <meta name="theme-color" content="#15803d">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: linear-gradient(160deg, #0f5132, #15803d 55%, #0b3d26); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #10231a; }
        .card { width: 100%; max-width: 380px; background: #fff; border-radius: 20px; padding: 28px 22px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.25); }
        img { width: 64px; height: 64px; border-radius: 16px; }
        h1 { font-size: 1.35rem; margin: 14px 0 6px; overflow-wrap: anywhere; }
        p { margin: 0 0 20px; color: #4b5d54; line-height: 1.45; overflow-wrap: anywhere; }
        a.btn { display: block; padding: 14px 16px; border-radius: 14px; background: #15803d; color: #fff; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main class="card">
        <img src="/icon-192.png" alt="DrillRig">
        <h1>Page not found</h1>
        <p>This link is wrong or old. Your bills are safe. Open the app to continue.</p>
        <a class="btn" href="/">Open DrillRig</a>
    </main>
</body>
</html>
